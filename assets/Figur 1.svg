     id="title1">Fællesoffentlig rammearkitektur og It-udvikling og drift</title><desc
     id="desc1">FDA-konvertering. Ingen piktogrammer i originalen (rene styrings-/governance-bokse), så der er ikke indsat DIGST-ikoner. Originalens lavendel og orange matchede ikke tæt nok på nogen DIGST-palettefarve til et automatisk snap, men er på brugerens ønske tvunget ind i paletten: lavendel → himmelblå #A3BFFF (nærmeste lyse paletfarve; blåviolet #4C61D1 blev fravalgt, da den er for mørk/mættet til en stor baggrundsflade), orange → koral #FB7A5C (nærmeste lyse/mættede paletfarve; paprika #AB2A0C blev fravalgt, da den ville gøre feltet mørkt/tungt i stedet for at bevare originalens lyse, bløde farvestyrke) — begge valg flagget, da hverken himmelblå eller koral rammer den oprindelige farvetone præcist. Kontrast af sort tekst (#3F1A2B) på koral er efterprøvet: ca. 6,2:1, består AA. Titel-teksten på den orange boks er normaliseret til husets sorte tekstfarve for garanteret kontrast, i stedet for originalens farvede overskrift — flagget. Strukturel afvigelse fra standard-lagrækkefølgen: de to store containerbokse (Fællesoffentlig rammearkitektur, It-udvikling og drift) er lagt i baggrundslaget i stedet for i &quot;shapes&quot;, så &quot;Udpeger&quot;-pilen kan ses ovenpå himmelblå-baggrunden i stedet for at blive skjult af den — flagget som bevidst tilpasning for denne diagramtype. Alle øvrige bokse (Reference-/Løsningsarkitektur, Standarder, It-løsning, Forretningsmål) er hvide/himmelblå med tynd sort kant (2px), som i originalen. Pile husets 5px sorte standard. Skrift Arial/Helvetica.</desc><defs
